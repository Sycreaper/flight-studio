name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Flutter/Dart: static analysis + full test suite (unit + widget). The
  # real-data smoke tests skip automatically when the X-Plane install is
  # absent (CI).
  flutter-analyze-and-test:
    name: Flutter analyze & test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze --no-pub

      - run: flutter test --reporter compact

  # TypeScript Agent Gateway (`agent_gateway/`): typecheck + unit tests
  # (safety policy, title normalization, LLM proxy, tool registry, phase
  # mapping). No Letta backend or network credentials needed.
  gateway-test:
    name: Gateway typecheck & test (Node 22, ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent_gateway/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test

  # Primary desktop target — verifies the Windows runner, version resource
  # and the full native toolchain compile.
  build-windows:
    name: Build Windows (debug)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build windows --debug

      - name: Upload Windows debug build
        uses: actions/upload-artifact@v4
        with:
          name: flight-studio-windows-debug
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error

  # Android toolchain — validates the Gradle config, manifest and plugin
  # builds (shared_preferences_android etc.) that Windows builds never touch.
  build-android:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flight-studio-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
