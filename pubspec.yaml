name: flight_studio
description: "An open-source, cross-platform flight simulator route planner and live flight tracker. Connects to MSFS, X-Plane 12 and Prepar3D, with remote monitoring and control from mobile and web clients."
publish_to: 'none'
version: 0.1.0+1

homepage: https://github.com/flight-studio/flight-studio
repository: https://github.com/flight-studio/flight-studio
issue_tracker: https://github.com/flight-studio/flight-studio/issues
# documentation: https://flight-studio.github.io/docs

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # SVG rendering (app logo, icons)
  flutter_svg: ^2.0.10+1

  # State management (built-in ChangeNotifier + MVVM pattern per project rules)

  # Routing
  go_router: ^14.6.2

  # Map rendering (the only Flutter map supporting Windows desktop)
  flutter_map: ^8.3.1
  latlong2: ^0.9.1

  # Local database (reactive SQLite, isolate-friendly)
  drift: ^2.34.1
  sqlite3_flutter_libs: ^0.5.28

  # Serialization & immutable models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.3

  # Embedded server (remote monitoring from phone/web)
  shelf: ^1.4.2
  shelf_router: ^1.1.0

  # Charts (altitude/fuel profile)
  fl_chart: ^1.0.0

  # Utilities
  logging: ^1.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  collection: ^1.19.1
  window_manager: ^0.5.2

  # Key-value persistence for user settings (theme, locale, connections, BYOK
  # provider config). Lightweight, plugin-backed, works on every Flight Studio
  # target platform (Windows / macOS / Linux / Android / iOS / Web).
  shared_preferences: ^2.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.9.4
  drift_dev: ^2.34.1

  # Testing
  mocktail: ^1.0.4
  checks: ^0.3.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/
