  <circle cx="50" cy="18" r="2.6" fill="#FF7F27"/>
  <!-- airplane -->
  <g transform="translate(32 32) rotate(-35)">
    <path d="M0 -13 L2.4 -4 L13 -2 L13 2 L2.4 4 L1.4 10 L5 12 L5 13.6 L0 12.8 L-5 13.6 L-5 12 L-1.4 10 L-2.4 4 L-13 2 L-13 -2 L-2.4 -4 Z" fill="url(#accent)"/>
  </g>
</svg>
